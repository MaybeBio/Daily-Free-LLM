[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shovel"
version = "0.1.0"
description = "免费 LLM API 金铲子：追踪、探活、统一 OpenAI 兼容网关"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shovel = "shovel.cli:main"

[tool.setuptools]
packages = ["shovel", "shovel.gateway"]
