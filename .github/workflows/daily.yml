name: daily-shovel

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update external sources
        run: python -m shovel update --timeout 30
        continue-on-error: true

      - name: Probe configured providers
        run: python -m shovel probe --timeout 20 --workers 8
        continue-on-error: true
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_KEY }}
          DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_KEY }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          MODELSCOPE_KEY: ${{ secrets.MODELSCOPE_KEY }}
          HUNYUAN_KEY: ${{ secrets.HUNYUAN_KEY }}
          QIANFAN_KEY: ${{ secrets.QIANFAN_KEY }}
          VOLC_ARK_KEY: ${{ secrets.VOLC_ARK_KEY }}
          SPARK_KEY: ${{ secrets.SPARK_KEY }}
          MINIMAX_KEY: ${{ secrets.MINIMAX_KEY }}
          STEPFUN_KEY: ${{ secrets.STEPFUN_KEY }}
          YI_KEY: ${{ secrets.YI_KEY }}
          BAICHUAN_KEY: ${{ secrets.BAICHUAN_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          TOGETHER_KEY: ${{ secrets.TOGETHER_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          SAMBANOVA_KEY: ${{ secrets.SAMBANOVA_KEY }}
          NEBIUS_KEY: ${{ secrets.NEBIUS_KEY }}
          NOVITA_KEY: ${{ secrets.NOVITA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Regenerate catalog, README, CSV and dashboard
        run: python -m shovel report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
